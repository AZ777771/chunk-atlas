plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
    archivesName = 'chunk-atlas'
}

version = "${rootProject.mod_version}+${minecraft_version}"
group = rootProject.group

def shared = rootProject.file('src')

sourceSets {
    main {
        java.srcDirs = [new File(shared, 'main/java'), 'src/main/java']
        resources.srcDirs = [new File(shared, 'main/resources'), 'src/main/resources']
    }
    test {
        java.srcDirs = [new File(shared, 'test/java'), 'src/test/java']
        resources.srcDirs = [new File(shared, 'test/resources'), 'src/test/resources']
    }
}

repositories {
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version, minecraft_version: minecraft_version, java_version: java_version, access_widener: access_widener]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
    options.encoding = 'UTF-8'

    options.compilerArgs += ['-Xmaxerrs', '10000']
}

def core = project(':core')

jar {
    from(core.sourceSets.main.output)
    from(rootProject.file('LICENSE')) {
        rename { "${it}_chunkatlas" }
    }
}

sourcesJar {
    from(core.sourceSets.main.allSource)
}

tasks.withType(AbstractArchiveTask).configureEach {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}

loom {
    accessWidenerPath = file("src/main/resources/${access_widener}")
    mods {
        chunkatlas {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach {
            runDir "../../run"
        }

        atlasClient {
            client()
            name "Atlas client"
            programArgs "--username", "AtlasDev"
        }
    }
}
